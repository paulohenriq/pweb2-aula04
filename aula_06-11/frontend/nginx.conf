# Nginx do container do frontend.
# - Serve o build estático do React.
# - Encaminha (proxy) as chamadas /api/* para o backend que roda na SUA máquina.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # host.docker.internal = "a máquina host" (você), visto de dentro do container.
    # É assim que o frontend no container alcança o backend que você roda
    # localmente com `npm run dev` na porta 3000.
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
    }

    # SPA: qualquer outra rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
