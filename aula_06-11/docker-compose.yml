# Sobe o frontend (React) em container e o PostgreSQL.
#
# O BACKEND (NestJS) roda LOCALMENTE na sua máquina:
#     cd backend-inicial && npm install && npm run start:dev   # porta 3000
#
# O frontend (container) encaminha /api para o backend local via
# host.docker.internal:3000 (veja frontend/nginx.conf).

services:
  frontend:
    build: ./frontend
    container_name: web2-todo-auth-frontend
    ports:
      - "5173:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:16-alpine
    container_name: web2-todo-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
